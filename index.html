<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f4e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="适配移动端的像素风贪吃蛇游戏" />
    <title>像素贪吃蛇</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-CUchjHiq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CxyAI8PJ.css">
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <header class="hud">
          <div class="hud__stat">
            <span class="hud__label">得分</span>
            <strong class="hud__value" id="hud-score">0</strong>
          </div>
          <div class="hud__stat hud__stat--best">
            <span class="hud__label">最高</span>
            <strong class="hud__value" id="hud-best">0</strong>
          </div>
          <button class="icon-btn" id="btn-pause" type="button" aria-label="暂停游戏">
            <span aria-hidden="true">❚❚</span>
          </button>
        </header>

        <main class="playfield" id="playfield">
          <div class="playfield__canvas" id="game-canvas"></div>
          <div class="playfield__overlay" id="overlay-root"></div>
        </main>

        <footer class="controls">
          <p class="hint" id="hint">滑动屏幕或使用方向键控制</p>
          <div class="dpad" id="dpad" role="group" aria-label="方向控制">
            <button class="dpad__btn dpad__btn--up" type="button" data-action="up" aria-label="向上">
              <span aria-hidden="true">▲</span>
            </button>
            <button class="dpad__btn dpad__btn--left" type="button" data-action="left" aria-label="向左">
              <span aria-hidden="true">◀</span>
            </button>
            <button class="dpad__btn dpad__btn--right" type="button" data-action="right" aria-label="向右">
              <span aria-hidden="true">▶</span>
            </button>
            <button class="dpad__btn dpad__btn--down" type="button" data-action="down" aria-label="向下">
              <span aria-hidden="true">▼</span>
            </button>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
